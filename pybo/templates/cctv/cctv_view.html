<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종시 CCTV 위치</title>

    <!-- Bootstrap CSS CDN -->

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <style>
        /* 전체 페이지의 높이를 설정 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        h3 {
            margin-top: 0px;
            margin-bottom: 0px;
        }

        /* 지도는 화면 전체를 차지하게 설정 */
        #map {
            height: 100vh;
            width: 100%;
        }

        /* 고정된 헤더 섹션 스타일 (둥근 모서리 및 투명 배경 추가) */
        .header-section {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9); /* 반투명 배경 */
            padding: 20px;
            border-radius: 15px; /* 둥근 모서리 */
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); /* 그림자 */
            z-index: 1000; /* 지도가 헤더보다 아래에 있도록 설정 */
        }

        .form-table {
            table-layout: auto;
            margin-bottom: 10px;
            width: auto;
        }

        .form-table td {
            padding: 5px;
            white-space: nowrap;
        }

        .fixed-width-select {
            width: 150px;
            height: 25px;
        }

        .camera-count {
            font-size: 16px;
            margin-top: 0px;
        }
    </style>
</head>
<body>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 둥근 모서리를 가진 고정된 헤더 섹션 -->
    <div class="header-section">


        <!-- 테이블 형식으로 라벨과 리스트 정렬 -->
        <table class="form-table mx-auto">
            <tr>
                <td colspan="3"> <h3 class="text-center mb-4">세종시 CCTV 위치 지도</h3></td>
            </tr>
            <tr>
                <td class="align-middle">
                    <label for="agency-select" class="form-label">관리기관명:</label>
                </td>
                <td>
                    <select id="agency-select" class="form-select fixed-width-select">
                        <option value="">전체</option>
                        {% for agency in agencies %}
                            <option value="{{ agency }}">{{ agency }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td class="text-center camera-count" id="camera-total-count"> 0대</td>
            </tr>
            <tr>
                <td class="align-middle">
                    <label for="area-select" class="form-label">동/리 선택:</label>
                </td>
                <td>
                    <select id="area-select" class="form-select fixed-width-select">
                        <option value="">전체</option>
                    </select>
                </td>
                <td class="text-center camera-count" id="camera-area-count"> 0대</td>
            </tr>
        </table>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Bootstrap JS CDN -->

    <script>
        // 새로운 마커 아이콘 정의
        var cctvIcon = L.icon({
            iconUrl: '/static/cctv_icon.png',  // 아이콘 이미지 경로 수정
            iconSize: [32, 32],        // 아이콘 크기
            iconAnchor: [16, 32],      // 아이콘의 앵커 포인트 (아이콘의 중심)
            popupAnchor: [0, -32]      // 팝업 위치
        });

        var map = L.map('map').setView([36.4871, 127.2595], 13); // 세종시 중심 좌표

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var agencySelect = document.getElementById('agency-select');
        var areaSelect = document.getElementById('area-select');
        var cameraAreaCountDiv = document.getElementById('camera-area-count'); // 지역 카메라 수량을 표시하는 요소
        var cameraTotalCountDiv = document.getElementById('camera-total-count'); // 전체 카메라 수량을 표시하는 요소

        // 관리기관 선택 시 이벤트 처리
        agencySelect.addEventListener('change', function() {
            loadAreaOptions(agencySelect.value);
            loadCctvData(agencySelect.value, '');
        });

        // 지역 선택 시 이벤트 처리
        areaSelect.addEventListener('change', function() {
            loadCctvData(agencySelect.value, areaSelect.value, true); // 지역 선택 시 중심 이동
        });

        // 관리기관 선택에 따라 동/길/로/리 옵션 로드
        function loadAreaOptions(selectedAgency) {
            fetch(`/cctv_app/api/cctv_locations?agency=${selectedAgency}`)
                .then(response => response.json())
                .then(data => {
                    var areas = new Set();
                    data.locations.forEach(cctv => {
                        if (cctv.dong) areas.add(cctv.dong);
                        if (cctv.gil) areas.add(cctv.gil);
                        if (cctv.ro) areas.add(cctv.ro);
                        if (cctv.ri) areas.add(cctv.ri);
                    });

                    areaSelect.innerHTML = '<option value="">전체</option>';
                    areas.forEach(area => {
                        var option = document.createElement('option');
                        option.value = area;
                        option.textContent = area;
                        areaSelect.appendChild(option);
                    });
                });
        }

        // CCTV 위치 API 호출 및 지도에 표시 + CCTV 수량 표시
        function loadCctvData(selectedAgency, selectedArea, focusOnFirst) {
            try {
                var url = '/cctv_app/api/cctv_locations?';
                if (selectedAgency) {
                    url += `agency=${selectedAgency}`;
                }
                if (selectedArea) {
                    url += `&area=${selectedArea}`;
                }

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        map.eachLayer(function(layer) {
                            if (layer instanceof L.Marker) {
                                map.removeLayer(layer);
                            }
                        });

                        if (!selectedArea || selectedArea === "") {
                            map.setView([36.4871, 127.2595], 13);
                        }

                        var areaCameras = data.area_cameras;
                        var totalCameras = data.total_cameras;

                        if (data.locations.length > 0 && focusOnFirst) {
                            map.setView([data.locations[0].latitude, data.locations[0].longitude], 15);
                        }

                        data.locations.forEach(cctv => {
                            L.marker([cctv.latitude, cctv.longitude], { icon: cctvIcon })
                                .addTo(map)
                                .bindPopup(`<b>${cctv.name}</b><br>${cctv.address}<br>카메라대수: ${cctv.cameras}`);
                        });

                        cameraTotalCountDiv.textContent = `${totalCameras}대`;
                        cameraAreaCountDiv.textContent = `${areaCameras}대`;

                    })
                    .catch(error => {
                        console.error("Error fetching CCTV data:", error);
                    });
            } catch (error) {
                console.error("Error loading CCTV data:", error);
            }
        }

        loadCctvData('', '', false);
    </script>
</body>
</html>
